<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="../../../css/othello.css" />
        <script src="../../../js/othello.js" defer></script>
        <title>アキネーターオセロ</title>
    </head>
    <body>
        <h1><span id="team_color"></span><span id="request">先攻のチームを決定してください。</span></h1>
        <div class="color-button-wrapper" id="color_button_wrapper">
            <button type="button" class="color-button" id="red"></button>
            <button type="button" class="color-button" id="blue"></button>
        </div>
        <h2 class="qty" id="qty">
            <span id="team1_color"></span>: <span id="team1_count"></span>
            / <span id="team2_color"></span>: <span id="team2_count"></span>
        </h2>
        <div id="board" class="board"></div>
        <div id="modal_background" class="modal-background">
            <div id="modal" class="modal">
                お題:
                <h3 id="topic"></h3>
                <div id="close" class="close">
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </body>
</html>
