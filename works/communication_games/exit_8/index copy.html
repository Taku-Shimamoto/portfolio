<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Taro Shuro's Portfolio</title>
    </head>
    <style>
        .img-wrapper {
            position: relative;
        }

        img {
            inset: 0;
            opacity: 0;
            position: absolute;
            transition: opacity 2s;
            width: 400px;
        }

        img.active {
            opacity: 1;
        }
    </style>
    <body>
        <div class="img-wrapper">
            <img class="img active" src="images/gallery01.jpg" alt="" />
            <img class="img" src="images/gallery02.jpg" alt="" />
            <img class="img" src="images/gallery03.jpg" alt="" />
            <img class="img" src="images/gallery04.jpg" alt="" />
        </div>
    </body>
    <script>
        const images = document.querySelectorAll("img");
        let i = 0;

        setInterval(() => {
            images.forEach((image) => image.classList.remove("active"));
            i = (i + 1) % images.length;
            images[i].classList.add("active");
        }, 4000);
    </script>
</html>
