<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="../common.css" />
        <title>自動演奏ピアノアプリ</title>
    </head>
        <style>
            body {
                font-family: sans-serif;
                margin: 0;
                padding: 0;
            }

            .top-lid {
                background-color: #000;
                border-radius: 50% 100% 0 0;
                height: 300px;
                margin: 84px auto 0 auto;
                width: 600px;
            }

            .title {
                color: #fff;
                height: 16px;
                margin-left: 60px;
                padding-top: 30px;
            }

            .keyboard {
                background-color: #000;
                border-radius: 0 0 20px 20px;
                margin: 0 auto;
                padding-bottom: 10px;
                width: 600px;
                z-index: 1;
            }

            .current-sound {
                background-color: lightyellow;
                border-radius: 10px;
                color: brown;
                font-size: 28px;
                height: 50px;
                line-height: 50px;
                margin: 50px auto 10px auto;
                text-align: center;
                width: 20%;
            }

            .buttons {
                text-align: center;
            }

            .border {
                background-color: olive;
                height: 5px;
                margin: 35px 0;
                transform: skewY(1deg);
                width: 100%;
            }

            .sounds {
                height: 210px;
                margin-bottom: 10px;
                position: relative;
                text-align: center;
            }

            .sounds p {
                margin-top: 150px;
            }

            .natural {
                background-color: #fff;
                border: 1px solid #000;
                border-radius: 5px;
                box-shadow: 0 3px gray;
                cursor: pointer;
                display: inline-block;
                font-size: 24px;
                height: 200px;
                margin: 0 auto;
                width: 60px;
                z-index: 1;
            }

            .natural:hover {
                background-color: lightgray;
            }

            .natural:active,
            input:active {
                box-shadow: none;
                transform: translateY(3px);
            }

            .active,
            .active:hover {
                background-color: yellow;
                box-shadow: none;
                transform: translateY(3px);
            }

            .sharp {
                background-color: #222;
                border-radius: 3px;
                box-shadow: 0 1px #444;
                display: inline-block;
                height: 120px;
                position: absolute;
                top: 0px;
                transform: translateX(-25px);
                width: 45px;
                z-index: 2;
            }

            .sharp p {
                color: #fff;
                font-size: 12px;
                transform: translateY(-55px);
            }

            .sharp:hover {
                background-color: #444;
            }

            .sharp:active {
                box-shadow: none;
                top: 1px;
            }

            .sharp_active,
            .sharp_active:hover {
                background-color: olive;
                box-shadow: none;
                top: 1px;
            }

            .btn {
                border: none;
                border-radius: 50px;
                cursor: pointer;
                font-size: 18px;
                letter-spacing: .05em;
                margin: 0 5px;
                padding: 10px 20px;
            }

            .autoplay {
                background-color: lightgreen;
                box-shadow: 0 3px darkgreen;
            }

            .stop {
                background-color: lightcoral;
                box-shadow: 0 3px darkred;
            }

            .on {
                background-color: lemonchiffon;
                box-shadow: 0 3px olive;                
            }

            .off {
                background-color: lightblue;
                box-shadow: 0 3px navy;
            }

            .btn:hover {
                opacity: .9;
            }

            .disabled {
                pointer-events: none;
            }
        </style>
    <body>
        <header>
            <h1 class="header-left">
                    <a href="../index.html">
                        <span>Taku</span>
                        <span>Shimamoto</span>
                    </a>
                </h1>
            <nav class="header-right">
                <ul class="menu-list">
                    <li class="menu"><a href="#">Top</a></li>
                    <li class="menu"><a href="../index.html#profile">Profile</a></li>
                    <li class="menu"><a href="../index.html#works">Works</a></li>
                    <li class="menu"><a href="../index.html#contact">Contact</a></li>
                </ul>
            </nav>
        </header>
        <div class="top-lid">
            <div id="title" class="title"></div>
            <div id="current_sound" class="current-sound"></div>
            <div class="border"></div>
            <div class="buttons">
                <input type="button" id="autoplay_button" class="btn autoplay" value="▶自動演奏" />
                <input type="button" id="toggle_soundname_button" class="btn off" value="音名表示: OFF" />
            </div>
        </div>
        <div class="keyboard">
            <div id="sounds" class="sounds">
                <div id="do" class="natural"><p class="sound-name">ド</p></div>
                <div id="sharp_do" class="sharp"><p class="sound-name">ド#</p></div>
                <div id="re" class="natural"><p class="sound-name">レ</p></div>
                <div id="sharp_re" class="sharp"><p class="sound-name">レ#</p></div>
                <div id="mi" class="natural"><p class="sound-name">ミ</p></div>
                <div id="fa" class="natural"><p class="sound-name">ファ</p></div>
                <div id="sharp_fa" class="sharp"><p class="sound-name">ファ#</p></div>
                <div id="so" class="natural"><p class="sound-name">ソ</p></div>
                <div id="sharp_so" class="sharp"><p class="sound-name">ソ#</p></div>
                <div id="ra" class="natural"><p class="sound-name">ラ</p></div>

                <div id="si" class="natural"><p class="sound-name">シ</p></div>
                <div id="higher_do" class="natural"><p class="sound-name">ド</p></div>
            </div>
        </div>

            // 手動演奏によるUIを消すためのミリ秒

            // DOM, Audio, ボタンをKEY_DEFSから生成して保持
            const keyRegistry = {
                natural: KEY_DEFS.natural.map((def) => ({
                    id: def.id,
                    kind: "natural",
                    element: document.getElementById(def.id),
                    button: null,
                    audio: new Audio(def.audioSrc),
                })),
                sharp: KEY_DEFS.sharp.map((def) => ({
                    id: def.id,
                    kind: "sharp",
                    element: document.getElementById(def.id),
                    button: null,
                    audio: new Audio(def.audioSrc),
                })),
            };

            // ボタン配列
            const naturalKeyButtons = Array.from(
                document.getElementsByClassName("natural")
            );
            const sharpKeyButtons = Array.from(
                document.getElementsByClassName("sharp")
            );
            const naturalSoundNames = Array.from(
                document.getElementsByClassName("sound-name")
            );

            // 鍵盤DOM
            const naturalKeyElements = keyRegistry.natural.map((k) => k.element);
            const sharpKeyElements = keyRegistry.sharp.map((k) => k.element);

            // ボタンとregistryとの紐づけ
            keyRegistry.natural.forEach((k, index) => {
                k.button = naturalKeyButtons[index] || null;
            });
            keyRegistry.sharp.forEach((k, index) => {
                k.button = sharpKeyButtons[index] || null;
            });

            // キー参照
            function getKeyRef(kind, index) {
                const list =
                    kind === "natural" ? keyRegistry.natural : keyRegistry.sharp;
                return list[index] || null;
            }

            // 楽譜データ
            function note(kind, index, durationMs) {
                return { kind, index, durationMs };
            }
            function rest(durationMs) {
                return { kind: "rest", index: -1, durationMs };
            }

            const SONGS = [
                {

                    title: "きらきら星",
                    score: [

                        rest(500),

                        rest(500),
                        note("natural", 3, 500),
                        rest(500),
                        note("natural", 3, 500),
                        rest(500),
                        note("natural", 2, 500),
                        rest(500),
                        note("natural", 2, 500),
                        rest(500),
                        note("natural", 1, 2000),

                        note("natural", 0, 500),
                        rest(500),
                        note("natural", 0, 500),
                        rest(500),
                        note("natural", 4, 500),
                        rest(500),
                        note("natural", 4, 500),
                        rest(500),
                        note("natural", 5, 500),
                        rest(500),
                        note("natural", 5, 500),
                        rest(500),
                        note("natural", 4, 2000),

                        note("natural", 3, 500),
                        rest(500),
                        note("natural", 3, 500),
                        rest(500),
                        note("natural", 2, 500),
                        rest(500),
                        note("natural", 2, 500),
                        rest(500),
                        note("natural", 1, 500),
                        rest(500),
                        note("natural", 1, 500),
                        rest(500),
                        note("natural", 0, 4000),
                    ],
                },
                {
                    id: "tulip",
                    title: "チューリップの歌",
                    score: [

                        note("natural", 2, 1000),
                        note("natural", 0, 500),
                        note("natural", 1, 500),

                        note("natural", 4, 500),
                        note("natural", 2, 500),
                        note("natural", 1, 500),

                        note("natural", 2, 250),

                        rest(250),

                        rest(250),

                        rest(250),
                        note("natural", 0, 4000),
                    ],
                },
                {
                    id: "yuyake",
                    title: "夕焼け小焼け",
                    score: [
                        note("natural", 4, 500),

                        note("natural", 4, 500),
                        note("natural", 5, 500),
                        note("natural", 4, 500),
                        note("natural", 4, 500),
                        note("natural", 4, 500),
                        note("natural", 2, 500),
                        note("natural", 0, 500),
                        note("natural", 0, 500),
                        note("natural", 1, 500),
                        note("natural", 2, 500),
                        note("natural", 1, 2000),

                        note("natural", 2, 1000),
                        note("natural", 2, 500),
                        note("natural", 4, 500),
                        note("natural", 5, 500),
                        note("natural", 7, 500),
                        note("natural", 7, 500),
                        note("natural", 5, 500),
                        note("natural", 4, 500),
                        note("natural", 4, 500),
                        note("natural", 5, 500),
                        note("natural", 4, 500),
                        note("natural", 7, 2000),

                        note("natural", 7, 1000),
                        note("natural", 7, 500),
                        note("natural", 5, 500),
                        note("natural", 7, 500),
                        note("natural", 7, 500),
                        note("natural", 4, 500),
                        note("natural", 4, 500),
                        note("natural", 5, 500),
                        note("natural", 4, 500),
                        note("natural", 5, 500),
                        note("natural", 4, 500),
                        note("natural", 2, 2000),
                        
                        note("natural", 4, 500),
                        note("natural", 2, 500),
                        note("natural", 1, 500),
                        note("natural", 0, 500),
                        note("natural", 1, 500),
                        note("natural", 1, 500),
                        note("natural", 0, 500),
                        note("natural", 1, 500),
                        note("natural", 2, 500),
                        note("natural", 4, 500),
                        note("natural", 5, 500),
                        note("natural", 4, 500),
                        note("natural", 7, 4000),
                    ],
                },
                {
                    id: "doremi",
                    title: "ドレミの歌",
                    score: [
                        note("natural", 0, 750),
                        note("natural", 1, 250),
                        note("natural", 2, 750),
                        note("natural", 0, 250),
                        note("natural", 2, 500),
                        note("natural", 0, 500),
                        note("natural", 2, 1000),

                        note("natural", 1, 750),
                        note("natural", 2, 250),
                        note("natural", 3, 250),

                        note("natural", 3, 2000),

                        note("natural", 2, 750),

                        note("natural", 3, 750),

                        note("natural", 5, 750),
                        note("natural", 1, 250),
                        note("natural", 2, 250),
                        note("sharp", 2, 250),
                        note("natural", 4, 250),
                        note("natural", 5, 250),
                        note("natural", 6, 2000),

                        note("natural", 6, 750),
                        note("natural", 2, 250),
                        note("sharp", 2, 250),
                        note("sharp", 3, 250),
                        note("natural", 5, 250),
                        note("natural", 6, 250),
                        note("natural", 7, 1500),

                        note("natural", 6, 250),
                        note("sharp", 4, 250),
                        note("natural", 5, 500),
                        note("natural", 3, 500),
                        note("natural", 6, 500),
                        note("natural", 4, 500),
                        note("natural", 7, 4000),
                    ],
                },
            ];

            // 各変数
            const state = {
                timers: {                       // タイマー変数群
                    manualEraseTimerId : null,  // 手動演奏によるUIを消す用のタイマー
                    autoPlayTimerId: null,      // 自動演奏用タイマー
                },
                autoPlay: {                     // 自動演奏群
                    isAutoPlaying: false,       // 自動演奏中の状態
                    currentSong: null,          // 現在の楽曲
                    scoreIndex: 0,              // 自動演奏の進行状況
                },
                isHidden: false,                // 鍵盤の音名表示状態
            };

            // 見た目(UI)の処理
            // 音名の表示/非表示
            function toggleSoundName() {
                if (!state.isHidden) {
                    state.isHidden = true;
                    naturalSoundNames.forEach((btn) => btn.style.display = "none");
                } else if (state.isHidden) {
                    state.isHidden = false;
                    naturalSoundNames.forEach((btn) => btn.style.display = "block");
                }
                setToggleSoundNameButtonText(state.isHidden ? "音名表示: ON " : "音名表示: OFF");
                setToggleSoundNameButtonUI();
            }
            // 音名表示エリアの非表示
            function clearSoundArea() {
                dom.currentSoundText.textContent = "";
            }

            // 鍵盤の色付けの非表示
            function clearKeyHighlight() {
                naturalKeyElements.forEach((el) => el.classList.remove("active"));
                sharpKeyElements.forEach((el) => el.classList.remove("sharp_active"));
            }

            // 手動演奏によるUIを1秒後に消す
            function scheduleErase() {
                state.timers.manualEraseTimerId = setTimeout(() => {
                    clearKeyHighlight();
                    clearSoundArea();
                }, ERASE_MS);
            }

            // 自動演奏に伴う鍵盤のクリックを遮断
            function setKeysEnabled(enabled) {
                dom.soundArea.classList.toggle("disabled", !enabled);
                const pointer = enabled ? "auto" : "none";
                naturalKeyButtons.forEach((btn) => (btn.style.pointerEvents = pointer));
                sharpKeyButtons.forEach((btn) => (btn.style.pointerEvents = pointer));
            }

            // ボタンの表示文字の変更
            // 自動演奏ボタン
            function setAutoPlayButtonButtonText(text) {
                dom.autoPlayButton.value = text;
                dom.autoPlayButton.textContent = text;
            }
            // 音名表示/非表示ボタン
            function setToggleSoundNameButtonText(text) {
                dom.toggleSoundNameButton.value = text;
                dom.toggleSoundNameButton.textContent = text;
            }

            // ON/OFFボタンのUI
            function setToggleSoundNameButtonUI() {
                dom.toggleSoundNameButton.classList.toggle("on", state.isHidden);
                dom.toggleSoundNameButton.classList.toggle("off", !state.isHidden);
            }

            // 自動演奏によるUI表示
            function setAutoPlayUI(isPlaying, songTitle="") {
                dom.autoPlayButton.classList.toggle("autoplay", !isPlaying);
                dom.autoPlayButton.classList.toggle("stop", isPlaying);
                setAutoPlayButtonButtonText(isPlaying ? "■ 演奏中止" : "▶自動演奏");
                dom.titleText.textContent = isPlaying
                    ? `自動演奏中です：${songTitle}`
                    : "";
                if (isPlaying) {
                    setKeysEnabled(false);
                    return;
                }
                    clearKeyHighlight();
                    clearSoundArea();
                    setKeysEnabled(true);
            }

            // 音源の再生
            function playAudio(audio) {
                audio.currentTime = 0;
                audio.play();
            }

            // 音名表示エリア
            function showCurrentSound(buttonEl) {
                dom.currentSoundText.textContent = `♪${buttonEl.textContent}`;
            }

            // 鍵盤にactiveクラスを付与し、色付けを行う
            function highlightKey(kind, index) {
                clearKeyHighlight();
                if (kind === "natural") {
                    naturalKeyElements[index]?.classList.add("active");
                    return;
                } else if (kind === "sharp") {
                    sharpKeyElements[index]?.classList.add("sharp_active");
                }
            }

            // 音出しの処理
            function renderNote(kind, index) {
                const keyRef = getKeyRef(kind, index);
                if (!keyRef) {
                    return;
                }

                playAudio(keyRef.audio);
                if (keyRef.button) {
                    showCurrentSound(keyRef.button);
                }
                highlightKey(kind,index);
            }

            // 自動演奏の1ステップ処理
            function performNoteStep(step) {
                if (step.kind === "rest") {
                    clearSoundArea();
                    clearKeyHighlight();
                    return;
                }
                renderNote(step.kind, step.index);
            }

            // 手動演奏
            function handleManualPlay(kind, index) {
                if (state.autoPlay.isAutoPlaying) {
                    return;
                }
                clearTimeout(state.timers.manualEraseTimerId);
                renderNote(kind, index);
                scheduleErase();
            }

            naturalKeyButtons.forEach(
                (btn, i) => btn.addEventListener("click", () => handleManualPlay("natural", i))
            );
            sharpKeyButtons.forEach(
                (btn, i) => btn.addEventListener("click", () => handleManualPlay("sharp", i))
            );

            // 楽曲の選定
            function selectSongAtRandom() {
                const randomIndex = Math.floor(Math.random() * SONGS.length);
                return SONGS[randomIndex];
            }

            // 演奏の進行
            function playNextScoreStep() {
                const { isAutoPlaying, currentSong, scoreIndex } = state.autoPlay;
                if (!isAutoPlaying || !currentSong) {
                    stopAutoPlay();
                    return;
                }
                if (scoreIndex >= currentSong.score.length) {
                    stopAutoPlay();
                    return;
                }

                const step = state.autoPlay.currentSong.score[state.autoPlay.scoreIndex];
                performNoteStep(step);
                
                state.autoPlay.scoreIndex += 1;
                state.timers.autoPlayTimerId = setTimeout(
                    playNextScoreStep,
                    step.durationMs
                );
            }

            // 自動演奏の開始
            function startAutoPlay() {
                clearTimeout(state.timers.manualEraseTimerId);
                if (state.autoPlay.isAutoPlaying) {
                    return;
                }

                state.autoPlay.isAutoPlaying = true;
                state.autoPlay.scoreIndex = 0;
                state.autoPlay.currentSong = selectSongAtRandom();

                setAutoPlayUI(true, state.autoPlay.currentSong.title);
                playNextScoreStep();
            }

            // 演奏中止
            function stopAutoPlay() {
                clearTimeout(state.timers.autoPlayTimerId);
                state.timers.autoPlayTimerId =  null;

                state.autoPlay.isAutoPlaying = false;
                state.autoPlay.currentSong = null;
                state.autoPlay.scoreIndex = 0;

                setAutoPlayUI(false);
            }

            // ボタン押下時の処理(条件によって自動演奏/演奏中止)
            function toggleAutoPlay() {
                if (state.autoPlay.isAutoPlaying) {
                    stopAutoPlay();
                    return;
                }
                startAutoPlay();
            }

            // ボタンとクリックイベントの紐づけ
            dom.autoPlayButton.addEventListener("click", toggleAutoPlay);
            dom.toggleSoundNameButton.addEventListener("click", toggleSoundName);
        </script> 
    </body>
</html>
